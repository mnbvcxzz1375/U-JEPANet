arm: A1
model:
  arm: A1
  in_chns: 1
  feature_chns: [16, 32, 64, 128]
  class_num: 16
  trilinear: true
  multiscale_pred: true
  deep_stage: 2
  embed_dim: 256
  num_heads: 4
  num_blocks: 4
  image_stride: 4
  feature_downsample: 1
  alpha_init: 0.1
  use_cnn_branch: true
data:
  synthetic: true
  patch_size: [64, 64, 64]
train:
  max_steps: 30000
  lr: 2.0e-4
  weight_decay: 1.0e-4
  lambda_j_max: 0.0
  seg_only_steps: 0
  ramp_steps: 0
  grad_clip: 1.0
  batch_size: 2
  log_every: 50
