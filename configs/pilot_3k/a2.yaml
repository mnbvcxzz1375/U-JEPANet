arm: A2
model:
  arm: A2
  in_chns: 1
  feature_chns: [16, 32, 64, 128]
  class_num: 17
  trilinear: true
  multiscale_pred: true
  deep_stage: 2
  norm: instance
  embed_dim: 256
  num_heads: 4
  num_blocks: 4
  predictor_blocks: 2
  jepa_token_stride: 16
  mask_ratio: 0.4
  ema_decay: 0.996
data:
  synthetic: false
  kind: npy
  root: /data/hyc/U-JEPANet/data/word_pilot_cache
  split: train
  val_split: val
  patch_size: [96, 96, 64]
  unlabeled_ids: []
train:
  max_steps: 3000
  lr: 2.0e-4
  weight_decay: 1.0e-4
  lambda_j_max: 0.3
  seg_only_steps: 300
  ramp_steps: 300
  grad_clip: 1.0
  batch_size: 2
  log_every: 50
  save_every: 1000
  val_every: 500
  do_val: true
