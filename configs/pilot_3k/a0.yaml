# 3k pilot — mechanism screening only, not formal 30k.
# Same seed/split/crop for all arms. Uses a train subset for wall-clock.
arm: A0
model:
  arm: A0
  in_chns: 1
  feature_chns: [16, 32, 64, 128]
  class_num: 17
  trilinear: true
  multiscale_pred: true
  deep_stage: 2
  norm: instance
data:
  synthetic: false
  kind: nifti_word
  word_root: /data/hyc/PLS4MIS/code/datasets/WORD
  split: imagesTr
  label_view: labelsTr_All
  val_split: imagesVal
  val_label_view: labelsVal
  patch_size: [96, 96, 64]
  max_cases: 20
  val_max_cases: 8
  unlabeled_ids: []
train:
  max_steps: 3000
  lr: 2.0e-4
  weight_decay: 1.0e-4
  lambda_j_max: 0.0
  seg_only_steps: 0
  ramp_steps: 0
  grad_clip: 1.0
  batch_size: 2
  log_every: 50
  save_every: 1000
  val_every: 500
  do_val: true
