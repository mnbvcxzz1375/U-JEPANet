arm: A3
model:
  arm: A3
  in_chns: 1
  feature_chns: [16, 32, 64, 128]
  class_num: 17
  trilinear: true
  multiscale_pred: true
  deep_stage: 2
  norm: instance
  embed_dim: 256
  num_heads: 4
  num_blocks: 4
  predictor_blocks: 2
  jepa_token_stride: 16
  alpha_init: 0.1
  use_cnn_branch: true
  mask_ratio: 0.4
  ema_decay: 0.996
data:
  synthetic: false
  kind: npy_sll
  root: /data/hyc/U-JEPANet/data/word_sll20_cache
  word_root: /data/hyc/PLS4MIS/code/datasets/WORD
  val_ids_file: /data/hyc/U-JEPANet/data/splits_sll20/val_20.txt
  patch_size: [128, 128, 96]
train:
  dual_loader: true
  max_steps: 30000
  lr: 2.0e-4
  weight_decay: 1.0e-4
  lambda_j_max: 0.3
  seg_only_steps: 3000
  ramp_steps: 3000
  grad_clip: 1.0
  batch_size: 2
  log_every: 100
  save_every: 5000
  val_every: 2000
  val_mode: whole
  val_stride: [64, 64, 48]
  do_val: true
